<!DOCTYPE html>
<html>
<head>
    <title>Image Grid</title>
    <style>
        .search-container {
            padding: 20px;
            text-align: center;
        }
        
        .search-input {
            width: 80%;
            max-width: 600px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .search-matches-input {
            width: 10%;
            max-width: 600px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        .search-button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .search-button:hover {
            background-color: #0056b3;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat({{ columns }}, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .grid-item {
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            position: relative;
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px;
            font-size: 12px;
        }
        .search-info {
            padding: 20px;
            margin-bottom: 20px;
            background: #f0f0f0;
        }
        .reference-image {
            width: 50px;
            height: 50px;
            object-fit: cover;
            margin-right: 10px;
            vertical-align: middle;
        }
        .find-similar-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            display: none;
        }
        .grid-item:hover .find-similar-btn {
            display: block;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <form method="POST" action="/search" id="searchForm">
            <div style="display: flex; align-items: center;">
                {% if reference_image %}
                <img src="{{ reference_image.url }}" class="reference-image" alt="Reference image">
                {% endif %}
                <input type="text" name="query" value="{{ query or '' }}" class="search-input" placeholder="Enter search query...">
                <input type="hidden" name="image_id" value="">
            </div>
            <div class="form-row">
                <label for="matches">Matches:</label>
                <input type="number" id="matches" name="matches" value="{{ matches or 6 }}">
                
                <label for="sensitivity">Sensitivity:</label>
                <input type="number" step="0.1" id="sensitivity" name="sensitivity" value="{{ sensitivity or 1.5 }}">
            </div>
            <div class="form-row button-row">
                <button type="submit" class="search-button">Search</button>
                <button type="button" class="search-button" onclick="rebuildIndex();">Rebuild Index</button>
            </div>
        </form>
    </div>
    
    <hr>
    
    <div class="search-info">
        {% if query %}
            <h2>Search results for: "{{ query }}"</h2>
        {% elif reference_id %}
            <h2>Similar images to ID: {{ reference_id }}</h2>
        {% endif %}
    </div>
    <div class="grid-container">
        {% for image in images %}
        <div class="grid-item">
            <img src="{{ image.url }}" alt="Image {{ image.id }}">
            <button onclick="findSimilar('{{ image.id }}', {{ matches }}, {{ sensitivity }})" 
                    class="find-similar-btn">Find Similar</button>
            <div class="image-info">
                Score: {{ image.score }}
                {% if image.captions %}
                <br>{{ image.captions[0] }}
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>

    <div id="imageOverlay" class="overlay" onclick="closeOverlay()">
        <div class="overlay-content">
            <img id="overlayImage" src="" alt="Enlarged image">
        </div>
    </div>

    <script>
        function openOverlay(imageSrc) {
            event.stopPropagation();
            document.getElementById('overlayImage').src = imageSrc;
            document.getElementById('imageOverlay').style.display = 'block';
        }

        function closeOverlay() {
            document.getElementById('imageOverlay').style.display = 'none';
        }

        function rebuildIndex() {
            fetch('/rebuildindex')
                .then(response => response.text())
                .then(data => alert(data));
        }

        function findSimilar(imageId, matches, sensitivity) {
            const form = document.getElementById('searchForm');
            form.querySelector('input[name="image_id"]').value = imageId;
            form.querySelector('input[name="matches"]').value = matches;
            form.querySelector('input[name="sensitivity"]').value = sensitivity;
            form.querySelector('input[name="query"]').value = '';  // Clear query when searching by image
            form.submit();
        }
    </script>
</body>
</html>
